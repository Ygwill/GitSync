name: Build Release APK (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install rust_bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
          cargo install cargo-expand --version 1.0.121 --locked

      - name: Get Packages
        run: flutter pub get

      - name: Generate Rust
        run: |
          flutter_rust_bridge_codegen generate
          git checkout HEAD -- rust/src/frb_generated.rs

      - name: Patch Premium (永远返回 true)
        run: |
          sed -i 's/return await repoManager.getBool(StorageKey.repoman_hasGHSponsorPremium);/return true;/g' \
            lib/api/manager/premium_manager.dart

      - name: Build Release APK (未签名)
        run: flutter build apk --release --no-sign

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: GitSync-Unsigned-APK
          path: build/app/outputs/flutter-apk/app-release-unsigned.apk
